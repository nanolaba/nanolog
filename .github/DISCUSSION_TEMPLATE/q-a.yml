body:
  - type: markdown
    attributes:
      value: |
        English or Russian, whichever is easier for you. A version, the JDK and a snippet help to answer, but none of them is required.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Nanolog version
      placeholder: "1.3"

  - type: input
    id: jdk
    attributes:
      label: JDK
      placeholder: "Temurin 17.0.10"

  - type: textarea
    id: code
    attributes:
      label: Code
      render: java
