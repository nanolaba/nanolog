name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 11, 17, 21 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        # -Dcheck=true makes nrg-maven-plugin fail the build when README.md / README.ru.md
        # are out of date with README.src.md instead of silently regenerating them
        run: mvn -B --no-transfer-progress -Dgpg.skip=true -Dcheck=true verify

      - name: A jlink image with Nanolog
        # jlink refuses automatic modules: the module descriptor in META-INF/versions/9 of the jar is what it needs,
        # and the image of java.base alone shows that Nanolog needs no other module of the JDK
        if: matrix.java != 8
        run: sh src/it/jlink/run.sh

      - name: Tests against SLF4J 1.7
        # Slf4jLogger uses only the API of SLF4J 1.7, which many applications still run: the tests once more against
        # slf4j-api and slf4j-simple 1.7.36, JUnit only; compiling against 1.7 fails on an API that only 2.x has
        if: matrix.java == 8
        run: mvn -B --no-transfer-progress -P slf4j-1.7 clean test-compile surefire:test

      - name: Calls from Kotlin
        # compiles src/test/kotlin, the calls of LOG as Kotlin code writes them: an overload that makes one of them
        # ambiguous for Kotlin fails here, although Java compiles it
        if: matrix.java == 17
        run: mvn -B --no-transfer-progress -P kotlin test-compile surefire:test -Dtest=KotlinCallersTest

  native:
    name: GraalVM ${{ matrix.java }} native image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GraalVM ${{ matrix.java }}
        uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          distribution: graalvm-community
          java-version: ${{ matrix.java }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Package
        run: mvn -B --no-transfer-progress -Dgpg.skip=true -DskipTests package

      - name: A native image that logs through Nanolog
        # only the metadata in META-INF/native-image of the jar: the program registers nothing itself
        run: sh src/it/native/run.sh
